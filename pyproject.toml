[project]
name = "simulator"
version = "0.1.0"
description = "Simulate survey responses from Twin-2K-500 personas"
requires-python = ">=3.15"
dependencies = [
    "datasets>=3",
    "huggingface-hub>=1",
    "openai>=1.78.1,<2",
    "pandas>=2.2.2,<3",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.9",
    "typesafe-sdk>=0.7.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
